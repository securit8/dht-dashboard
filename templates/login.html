<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in — Dream Homes Team</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #EEF0F5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 16px; padding: 36px 32px; width: 320px; box-shadow: 0 1px 3px rgba(31,42,68,0.08); text-align: center; }
    .logo { width: 140px; height: 140px; border-radius: 14px; margin: 0 auto 16px; display: block; }
    .sub { font-size: 12px; color: #8B93A1; margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #5B6472; margin-bottom: 6px; text-align: left; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #E3E6EC; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    button { width: 100%; padding: 11px; border: none; border-radius: 8px; background: #7B8FF0; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    .error { background: #FDEDEA; color: #C0392B; font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
    .try { margin-top: 22px; padding-top: 18px; border-top: 1px solid #EEF0F5; }
    .try p { font-size: 12.5px; color: #5B6472; margin: 0 0 10px; line-height: 1.5; }
    .try a { display: block; padding: 10px; border-radius: 8px; border: 1px solid #C9D2F7; color: #3A4FBF; font-size: 14px; font-weight: 600; text-decoration: none; }
    .try a:hover { background: #F2F4FD; }
    .agent { margin-top: 18px; font-size: 13px; color: #5B6472; }
    .agent a { color: #3A4FBF; font-weight: 600; text-decoration: none; }
    .agent a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="{{ url_for('static', filename='dht-logo.png') }}" alt="Dream Homes Team">
    <div class="sub">Sign in to view the dashboard</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <div class="agent">Are you an agent? <a href="/portal/signin">Agent portal &rarr;</a></div>
    {% if demo_url %}
    <div class="try">
      <p>Just looking? Explore the full dashboard filled with random numbers. It's a separate demo with no real data.</p>
      <a href="{{ demo_url }}" rel="noopener">Try it with random numbers &rarr;</a>
    </div>
    {% endif %}
  </div>
</body>
</html>
