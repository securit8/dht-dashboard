
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in — Dream Homes Team</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #EEF0F5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 16px; padding: 36px 32px; width: 320px; box-shadow: 0 1px 3px rgba(31,42,68,0.08); }
    h1 { margin: 0 0 4px; font-family: 'Fraunces', serif; font-size: 22px; color: #1F2A44; }
    .sub { font-size: 12px; color: #8B93A1; margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #5B6472; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #E3E6EC; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    button { width: 100%; padding: 11px; border: none; border-radius: 8px; background: #7B8FF0; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    .error { background: #FDEDEA; color: #C0392B; font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dream Homes Team</h1>
    <div class="sub">Sign in to view the dashboard</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
