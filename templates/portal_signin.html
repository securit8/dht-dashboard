<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent sign in — Dream Homes Team</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #EEF0F5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 16px; padding: 36px 32px; width: 340px; max-width: 100%; box-sizing: border-box; box-shadow: 0 1px 3px rgba(31,42,68,0.08); text-align: center; }
    .logo { width: 120px; height: 120px; border-radius: 14px; margin: 0 auto 16px; display: block; }
    h1 { font-size: 18px; margin: 0 0 6px; color: #1C2333; }
    .sub { font-size: 13px; color: #8B93A1; margin-bottom: 22px; line-height: 1.5; }
    .error { background: #FDEDEA; color: #C0392B; font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #5B6472; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #E3E6EC; border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
    .btn { width: 100%; padding: 11px; border: none; border-radius: 8px; background: #7B8FF0; color: #fff; font: 600 14px 'Inter', sans-serif; cursor: pointer; }
    .back { margin-top: 18px; padding-top: 16px; border-top: 1px solid #EEF0F5; font-size: 13px; color: #5B6472; }
    .back a { color: #3A4FBF; font-weight: 600; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="{{ url_for('static', filename='dht-logo.png') }}" alt="Dream Homes Team">
    <h1>Agent portal</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <div class="sub">Your own numbers: activity, appointments, deals and pay.</div>
      <form method="post" action="{{ url_for('password_login') }}" style="text-align:left">
        <label for="u">Username</label><input id="u" name="username" autocomplete="username" required autofocus>
        <label for="pw">Password</label><input id="pw" type="password" name="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Sign in</button>
      </form>
      <div class="sub" style="margin:14px 0 0">No login yet? Ask the team owners.</div>
      <div class="back">Team owner? <a href="/login">Dashboard sign-in &rarr;</a></div>
  </div>
</body>
</html>
